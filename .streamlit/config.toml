[theme]
base            = "dark"
primaryColor    = "#06c2ac"
backgroundColor = "#0b202b"
secondaryBackgroundColor = "#102c38"
textColor       = "#f1f7f8"
font            = "sans serif"

[server]
headless        = true
runOnSave       = false
maxUploadSize   = 5
enableStaticServing = true

[browser]
gatherUsageStats = false
